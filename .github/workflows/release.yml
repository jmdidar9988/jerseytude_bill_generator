name: Release & Deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Web & Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Quality & Tests
        run: |
          flutter analyze
          flutter test

      - name: Build Web Application
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Archive Web Output
        run: |
          cd build/web
          zip -r ../../jerseytude-web.zip .
          cd ../..

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Copy & Prepare APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk jerseytude-bill-generator.apk

      - name: Upload APK as GitHub Actions Artifact (Always Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: Jerseytude-Android-APK
          path: jerseytude-bill-generator.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Web Bundle as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jerseytude-Web-Bundle
          path: jerseytude-web.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Jerseytude Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            jerseytude-bill-generator.apk
            jerseytude-web.zip

      - name: Deploy to GitHub Pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publish to GitHub Pages
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4

  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Compress Windows Output
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Jerseytude-Windows-Desktop.zip"

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jerseytude-Windows-Desktop
          path: Jerseytude-Windows-Desktop.zip
          retention-days: 90

      - name: Attach Windows App to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Jerseytude-Windows-Desktop.zip
